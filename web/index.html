<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fieldwork</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #fff; --border: #e3e2df; --text: #1c1b19;
    --muted: #6d6a65; --accent: #2f6f4e; --accent-soft: #eaf2ed;
    --danger: #a33a2c; --null: #a8a5a0; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #181715; --panel: #201f1d; --border: #34322e; --text: #eceae6;
      --muted: #97938c; --accent: #6bbd90; --accent-soft: #23342b;
      --danger: #e08472; --null: #6d6a65;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 20px 24px; border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  #health { margin-left: auto; font-size: 12px; font-family: var(--mono); color: var(--muted); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--null); margin-right: 5px; }
  .dot.up { background: var(--accent); }
  .dot.down { background: var(--danger); }
  main { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(320px, 1.1fr); gap: 20px; padding: 20px 24px; max-width: 1200px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 6px; }
  select, button { font: inherit; border-radius: 7px; border: 1px solid var(--border); padding: 8px 12px; background: var(--panel); color: var(--text); }
  select { width: 100%; margin-bottom: 14px; }
  #drop {
    border: 1.5px dashed var(--border); border-radius: 10px; padding: 28px 16px;
    text-align: center; color: var(--muted); cursor: pointer; transition: .15s;
  }
  #drop.over, #drop:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
  #preview { display: none; margin-top: 14px; }
  #preview img { max-width: 100%; max-height: 380px; border-radius: 7px; border: 1px solid var(--border); display: block; }
  #filename { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 8px; word-break: break-all; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  pre { margin: 0; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; max-height: 62vh; overflow: auto; }
  .k { color: var(--muted); }
  .s { color: var(--text); }
  .n { color: var(--accent); }
  .null { color: var(--null); font-style: italic; }
  .err { color: var(--danger); font-family: var(--mono); font-size: 13px; white-space: pre-wrap; }
  .empty { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>fieldwork</h1>
  <span class="sub">structured extraction · phase 1 (synchronous)</span>
  <span id="health"><span class="dot"></span>checking…</span>
</header>

<main>
  <section class="panel">
    <label for="schema">Document type</label>
    <select id="schema"></select>

    <div id="drop">
      <strong>Drop an image or PDF</strong><br>
      <span class="sub">click to browse · or paste from clipboard</span>
    </div>
    <input type="file" id="file" accept="image/*,.pdf,.heic,.heif" hidden>

    <div id="preview">
      <img id="thumb" alt="">
      <div id="filename"></div>
    </div>

    <div class="actions">
      <button class="primary" id="go" disabled>Extract</button>
      <button id="clear" disabled>Clear</button>
    </div>
  </section>

  <section class="panel">
    <div class="stats" id="stats"></div>
    <div id="out"><p class="empty">Results appear here.</p></div>
    <div class="actions" id="outActions" style="display:none">
      <button id="copy">Copy JSON</button>
      <button id="download">Download</button>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let selected = null, lastResult = null, timer = null;

async function health() {
  const el = $('health');
  try {
    const r = await fetch('/healthz');
    const j = await r.json();
    if (j.ok && j.model_available) {
      el.innerHTML = `<span class="dot up"></span>${j.configured_model}`;
    } else if (j.ok) {
      el.innerHTML = `<span class="dot down"></span>${j.configured_model} not served`;
    } else {
      el.innerHTML = `<span class="dot down"></span>model server unreachable`;
    }
  } catch { el.innerHTML = `<span class="dot down"></span>api unreachable`; }
}

async function loadSchemas() {
  const r = await fetch('/v1/schemas');
  for (const s of await r.json()) {
    const o = document.createElement('option');
    o.value = s.name;
    o.textContent = `${s.name} — ${s.fields.length} fields`;
    $('schema').appendChild(o);
  }
}

function setFile(f) {
  if (!f) return;
  selected = f;
  $('filename').textContent = `${f.name} · ${(f.size / 1024).toFixed(0)} KB`;
  $('preview').style.display = 'block';
  $('go').disabled = false;
  $('clear').disabled = false;
  if (f.type.startsWith('image/')) {
    $('thumb').src = URL.createObjectURL(f);
    $('thumb').style.display = 'block';
  } else {
    $('thumb').style.display = 'none';
  }
}

function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

function highlight(value, indent = 0) {
  const pad = '  '.repeat(indent);
  if (value === null) return '<span class="null">null</span>';
  if (typeof value === 'number') return `<span class="n">${value}</span>`;
  if (typeof value === 'string') return `<span class="s">${esc(JSON.stringify(value))}</span>`;
  if (Array.isArray(value)) {
    if (!value.length) return '[]';
    const items = value.map(v => `${pad}  ${highlight(v, indent + 1)}`).join(',\n');
    return `[\n${items}\n${pad}]`;
  }
  const entries = Object.entries(value).map(
    ([k, v]) => `${pad}  <span class="k">${esc(JSON.stringify(k))}</span>: ${highlight(v, indent + 1)}`
  );
  return `{\n${entries.join(',\n')}\n${pad}}`;
}

async function extract() {
  if (!selected) return;
  const started = performance.now();
  $('go').disabled = true;
  $('outActions').style.display = 'none';
  $('out').innerHTML = '<p class="empty">Extracting…</p>';
  $('stats').textContent = '';
  timer = setInterval(() => {
    $('stats').textContent = `${((performance.now() - started) / 1000).toFixed(1)}s elapsed`;
  }, 100);

  const fd = new FormData();
  fd.append('file', selected);
  fd.append('schema', $('schema').value);

  try {
    const r = await fetch('/v1/extractions', { method: 'POST', body: fd });
    const j = await r.json();
    clearInterval(timer);
    if (!r.ok || !j.ok) {
      $('stats').textContent = '';
      $('out').innerHTML = `<div class="err">${esc(j.error || j.detail || r.statusText)}</div>`;
      return;
    }
    lastResult = j.data;
    const u = j.usage || {};
    $('stats').innerHTML = [
      `${j.latency_s}s`,
      `${j.pages} page${j.pages === 1 ? '' : 's'}`,
      u.prompt_tokens ? `${u.prompt_tokens} in / ${u.completion_tokens} out` : '',
      j.attempts > 1 ? `${j.attempts} attempts` : '',
    ].filter(Boolean).map(s => `<span>${s}</span>`).join('');
    $('out').innerHTML = `<pre>${highlight(j.data)}</pre>`;
    $('outActions').style.display = 'flex';
  } catch (e) {
    clearInterval(timer);
    $('out').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  } finally {
    $('go').disabled = false;
  }
}

$('drop').onclick = () => $('file').click();
$('file').onchange = (e) => setFile(e.target.files[0]);
$('drop').ondragover = (e) => { e.preventDefault(); $('drop').classList.add('over'); };
$('drop').ondragleave = () => $('drop').classList.remove('over');
$('drop').ondrop = (e) => {
  e.preventDefault();
  $('drop').classList.remove('over');
  setFile(e.dataTransfer.files[0]);
};
document.onpaste = (e) => {
  const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
  if (item) setFile(item.getAsFile());
};
$('go').onclick = extract;
$('clear').onclick = () => {
  selected = lastResult = null;
  $('preview').style.display = 'none';
  $('file').value = '';
  $('go').disabled = $('clear').disabled = true;
  $('out').innerHTML = '<p class="empty">Results appear here.</p>';
  $('stats').textContent = '';
  $('outActions').style.display = 'none';
};
$('copy').onclick = () => navigator.clipboard.writeText(JSON.stringify(lastResult, null, 2));
$('download').onclick = () => {
  const blob = new Blob([JSON.stringify(lastResult, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (selected?.name.replace(/\.[^.]+$/, '') || 'extraction') + '.json';
  a.click();
};

loadSchemas();
health();
setInterval(health, 15000);
</script>
</body>
</html>
