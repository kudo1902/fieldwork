[project]
name = "fieldwork"
version = "0.1.0"
description = "Structured content extraction from document images using a self-hosted Gemma 4 VLM"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pillow>=10.3",
    "pillow-heif>=0.16",
    "pypdfium2>=4.30",
    "flask>=3.0",
    "gunicorn>=22.0",
    "gevent>=24.2",
    "rich>=13.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldwork"]
